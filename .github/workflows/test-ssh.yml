name: Test SSH Deploy Access

on:
  workflow_dispatch:

jobs:
  ssh-check:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH for deploy user
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf "%s\n" "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: SSH as deploy and print hostname
        run: |
          ssh -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts deploy@${{ vars.DEPLOY_HOST }} "hostname"
